<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RC FPV ESP32</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- CAPA 0: cámara a pantalla completa (fondo). Es un <img> porque el stream MJPEG
         se pinta directamente en una etiqueta img, sin iframe ni JS de vídeo. -->
    <img id="camera" alt="" draggable="false">
    <div id="noSignal">SIN SEÑAL DE CÁMARA</div>

    <!-- CAPA 1: HUD por encima. pointer-events:none en el contenedor para que el
         ratón "atraviese" el HUD y se pueda arrastrar sobre el vídeo. -->
    <div id="hud">

        <!-- Barra superior: conexión, modo de entrada y batería -->
        <div class="top">
            <div class="chip" id="conn"><span class="dot"></span><span id="connText">Conectando…</span></div>
            <div class="chip" id="inputMode">⌨️ Teclado / 🖱️ Ratón</div>
            <div class="chip" id="battery">🔋 <span id="batValue">--</span> V</div>
        </div>

        <!-- Mira central -->
        <div class="crosshair"></div>

        <!-- Indicador de dirección (barra horizontal con aguja) -->
        <div class="steer">
            <div class="steer-bar"><div class="steer-needle" id="steerNeedle"></div></div>
            <span id="steerValue">0</span>
        </div>

        <!-- Velocímetro / acelerador (barra vertical que crece hacia arriba o abajo) -->
        <div class="throttle">
            <div class="thr-fwd"><div id="thrFwd"></div></div>
            <div class="thr-mid" id="thrValue">0</div>
            <div class="thr-bwd"><div id="thrBwd"></div></div>
        </div>

        <!-- Ayuda de controles (esquina inferior) -->
        <div class="help">
            <b>Teclado:</b> W/S acelerar·marcha atrás, A/D girar, ESPACIO freno<br>
            <b>Ratón:</b> mantén clic y arrastra (centro = parado)<br>
            <b>Mando:</b> RT/LT acelerar·atrás, stick izq. girar, ✕/A freno
        </div>

        <!-- Joystick virtual (visible sólo cuando se arrastra con ratón/dedo) -->
        <div id="joy"><div id="joyKnob"></div></div>
    </div>

    <script src="app.js" type="module"></script>
</body>
</html>
